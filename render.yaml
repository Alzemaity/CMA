services:
  - type: web
    name: cma-real-estate
    env: docker
    region: frankfurt
    plan: free
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: cma-postgres
          property: connectionString
      - key: OPENROUTER_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false

databases:
  - name: cma-postgres
    databaseName: cma_db
    user: cma_user
    region: frankfurt
    plan: free
